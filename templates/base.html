<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Python Web App{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">
  <header class="navbar">
    <div class="nav-container">
      <a href="{{ url_for('home') }}" class="brand">
        <span class="logo-icon">🐍</span>
        <span class="logo-text">Py<b>Flask</b></span>
      </a>
      <nav class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('home') }}#features">Features</a>
        <a href="{{ url_for('home') }}#dashboard">Live Dashboard</a>
        <a href="{{ url_for('about') }}">About</a>
      </nav>
      <div class="nav-actions">
        <button id="themeToggleBtn" class="btn btn-outline" title="Toggle Theme">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-brand">
        <span>🐍 Python Flask Website</span>
        <p>Built with Python 3.12, Flask, Jinja2, HTML5 & Modern CSS.</p>
      </div>
      <div class="footer-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About & Tech Stack</a>
        <a href="https://flask.palletsprojects.com/" target="_blank" rel="noopener">Flask Docs</a>
      </div>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
